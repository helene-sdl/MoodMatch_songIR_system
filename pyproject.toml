[project]
name = "musiclyricsir"
version = "0.1.0"
description = "Mood-based song retrieval system over 1.35M pop songs"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "datasets>=4.7.0",
    "faiss-cpu>=1.13.2",
    "gliner>=0.2.26",
    "ijson>=3.5.0",
    "networkx>=3.0",
    "nltk>=3.9.3",
    "rank-bm25>=0.2.2",
    "requests>=2.0.0",
    "sentence-transformers>=5.3.0",
    "streamlit>=1.57.0",
]
